[build-system]
requires = ["setuptools>=78,<82", "wheel>=0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-recognition-r6-source"
version = "0.1.0"
description = "Source archive for the revised-split fire-recognition R6 study"
requires-python = ">=3.11,<3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/*"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
